[package]
name = "vtb-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["whisper"]
whisper = ["vtb-asr/whisper"]

[dependencies]
vtb-common = { path = "../vtb-common" }
vtb-asr = { path = "../vtb-asr", default-features = false }
vtb-translate = { path = "../vtb-translate" }
vtb-highlight = { path = "../vtb-highlight" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
async-trait = "0.1.89"

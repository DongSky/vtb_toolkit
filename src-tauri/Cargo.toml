[package]
name = "vtb-toolkit"
version.workspace = true
edition.workspace = true
description = "VTuber toolkit: danmaku, recording, ASR, translation, highlights"
authors = ["dongsky"]

[lib]
name = "vtb_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["whisper"]
whisper = ["vtb-asr/whisper", "vtb-pipeline/whisper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
reqwest.workspace = true

vtb-common = { path = "../crates/vtb-common" }
vtb-danmaku = { path = "../crates/vtb-danmaku" }
vtb-recorder = { path = "../crates/vtb-recorder" }
vtb-asr = { path = "../crates/vtb-asr", default-features = false }
vtb-translate = { path = "../crates/vtb-translate" }
vtb-highlight = { path = "../crates/vtb-highlight" }
vtb-pipeline = { path = "../crates/vtb-pipeline", default-features = false }
async-trait = "0.1.89"

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/vtb-common",
    "crates/vtb-danmaku",
    "crates/vtb-recorder",
    "crates/vtb-asr",
    "crates/vtb-translate",
    "crates/vtb-highlight",
    "crates/vtb-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
